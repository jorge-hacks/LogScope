<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="LogScope">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#7C9CFF"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131A2E"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="14" y="14" width="228" height="228" rx="46" fill="none" stroke="url(#mark)" stroke-width="3" opacity=".45"/>

  <!-- marca: L (gradiente) + S (trazo) -->
  <g transform="translate(0,-6)">
    <path d="M62 62 h23 v92 h54 v23 H62 Z" fill="url(#mark)"/>
    <g transform="translate(10,0)">
      <path d="M193 82 C188 69 176 63 161 63 C143 63 132 74 132 90 C132 106 143 115 163 119 L170 120.5 C188 125 197 134 197 152 C197 171 185 182 165 182 C148 182 136 173 130 159"
            fill="none" stroke="#E6EDF7" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" opacity=".93"/>
    </g>
  </g>

  <!-- traza de timeline -->
  <g opacity=".85">
    <circle cx="56" cy="196" r="6" fill="#2DD4BF"/>
    <circle cx="112" cy="196" r="4.5" fill="#7C9CFF"/>
    <circle cx="160" cy="196" r="5.5" fill="#2DD4BF" opacity=".75"/>
    <circle cx="202" cy="196" r="3.5" fill="#FF4D6D"/>
  </g>
</svg>
