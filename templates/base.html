<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LogScope{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ asset("/static/css/theme.css") }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232DD4BF'/><text x='16' y='23' font-size='18' font-family='monospace' font-weight='bold' text-anchor='middle' fill='%23061220'>L</text></svg>">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">LS</div>
      <div>
        <div class="brand-name">LOGSCOPE</div>
        <div class="brand-sub">Log Intelligence</div>
      </div>
    </div>

    <nav class="nav">
      <a href="/" class="{% block nav_home %}{% endblock %}">
        <span class="nav-icon">▤</span> Analisis
      </a>
      <a href="/settings" class="{% block nav_settings %}{% endblock %}">
        <span class="nav-icon">⚙</span> Ajustes
      </a>
    </nav>

    <div class="side-foot">
      <div id="oc-status" title="Estado del motor opencode">
        <span class="status-dot"></span><span id="oc-status-text">comprobando...</span>
      </div>
      <div class="faint mt-1" style="font-size:.68rem">proveedor: {{ provider }}</div>
    </div>
  </aside>

  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>

<script src="{{ asset("/static/js/app.js") }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
